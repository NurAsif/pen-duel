<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pen Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen 3D bench; chalkboard panels slide over it for menus. */
:root{
  --ink:#0d1411;
  --board:#1b382e;
  --board-deep:#10241d;
  --chalk:#f4f1e6;
  --chalk-dim:#b4c6bb;
  --yellow:#ffd84d;
  --yellow-edge:#c79e1b;
  --red:#ff7b7b;
  --frame:#6b4423;
  --frame-hi:#8d5f33;
  --hand:'Caveat Brush','Hind Siliguri',cursive;
  --ui:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--chalk);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--hand);font-size:34px;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.7);animation:pop 1.2s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-70px;scale:1}}

#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
#chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(10,18,15,.62);border:2px solid var(--chalk);border-radius:999px;padding:2px 11px 2px 4px;font-size:13px;font-weight:700;white-space:nowrap;transition:transform .15s,background .15s}
.chip i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.chip.cur{background:rgba(255,255,255,.26);transform:scale(1.08)}
.chip.out{opacity:.4}
#turn{font-size:14px;font-weight:600;text-align:center;text-shadow:0 1px 4px #000;min-height:20px}
#gameControls{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
#gameControls[hidden]{display:none!important}
.ctrl-card{pointer-events:auto;background:rgba(10,18,15,.82);border:1px solid rgba(244,241,230,.55);border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px);box-shadow:0 5px 18px #0005;min-width:0}
.ctrl-title{font-size:11px;color:var(--chalk-dim);font-weight:700;letter-spacing:.06em;margin-bottom:5px}
.ctrl-actions{display:flex;gap:6px;align-items:center}
.ctrl-btn{border:1px solid var(--chalk-dim);background:#243c31;color:var(--chalk);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap;touch-action:manipulation}
.ctrl-btn.on{background:var(--yellow);color:#1a2620;border-color:var(--yellow)}
#angleControl{width:min(42vw,190px);accent-color:var(--yellow);display:block;margin:4px 0 0;touch-action:pan-x}
#angleValue{font-family:var(--hand);font-size:18px;color:var(--yellow);margin-left:6px}
@media(max-width:420px){#gameControls{left:6px;right:6px;gap:6px;bottom:calc(56px + env(safe-area-inset-bottom,0px))}.ctrl-card{padding:7px 8px}.ctrl-btn{padding:7px 8px;font-size:11px}#angleControl{width:36vw}}
#pauseBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,18,15,.7);color:var(--chalk);border:2px solid var(--chalk-dim);border-radius:999px;padding:6px 18px;font-size:14px;font-weight:600}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 40%,rgba(6,12,10,.5),rgba(6,12,10,.88));
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen.show{display:flex}
.panel{width:100%;max-width:440px;margin:auto 0;background:var(--board);border:7px solid var(--frame);border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--frame-hi),inset 0 0 46px rgba(0,0,0,.5),0 14px 44px rgba(0,0,0,.55);
  padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1,h2,h3{margin:0;font-weight:400}
h1{font-family:var(--hand);font-size:54px;line-height:1;text-align:center;letter-spacing:.5px;text-shadow:0 0 14px rgba(255,255,255,.18)}
h2{font-family:var(--hand);font-size:34px;line-height:1.1;text-align:center}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);font-weight:600}
html[lang=bn] h3{letter-spacing:0;text-transform:none;font-size:14px}
.sub{margin:0;text-align:center;color:var(--chalk-dim);font-size:15px;line-height:1.4;text-wrap:balance}
.card{background:rgba(0,0,0,.2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:14px;font-weight:600;color:var(--chalk);margin-top:4px}
.btn{background:var(--yellow);color:#1a2620;border:0;border-bottom:4px solid var(--yellow-edge);border-radius:11px;padding:12px 18px;font-size:18px;font-weight:700;cursor:pointer;width:100%}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.alt{background:transparent;color:var(--chalk);border:2px solid var(--chalk-dim)}
.btn.small{width:auto;font-size:14px;padding:8px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text]{width:100%;background:rgba(0,0,0,.28);border:2px solid var(--chalk-dim);border-radius:10px;color:var(--chalk);font-size:17px;padding:9px 12px;user-select:text;-webkit-user-select:text;touch-action:manipulation}
input[type=text]::placeholder{color:rgba(244,241,230,.4)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;border:2px solid rgba(244,241,230,.28);background:transparent;color:var(--chalk);font-weight:700;font-size:15px;cursor:pointer;min-width:0}
.seg button.on{background:var(--yellow);color:#1a2620;border-color:var(--yellow)}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--chalk);color:#1a2620;font-size:26px;font-weight:700;cursor:pointer}
.stepper b{font-size:32px;min-width:34px;text-align:center;font-family:var(--hand);font-weight:400}
.prow{display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.2);border-radius:10px;padding:9px 10px}
.prow .top{display:flex;align-items:center;gap:8px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;flex:none}
.tog{border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--chalk);color:#1a2620;cursor:pointer;flex:none}
.tog.cpu{background:#3d5a4d;color:var(--chalk)}
.pick{display:flex;align-items:center;gap:6px}
.pick canvas{width:110px;height:32px;flex:none;background:rgba(0,0,0,.3);border-radius:8px}
.pick .pn{flex:1;min-width:0;font-size:13px;line-height:1.2}
.pick .pn small{display:block;font-weight:400;color:var(--chalk-dim);font-size:11.5px}
.bars{display:flex;gap:6px;margin-top:3px}
.bars span{display:flex;flex-direction:column;gap:1px;font-size:9.5px;color:var(--chalk-dim);flex:1}
.bars u{display:block;height:4px;border-radius:2px;background:var(--yellow);text-decoration:none}
.arr{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--chalk);font-size:20px;line-height:1;flex:none;cursor:pointer}
.note{font-size:12.5px;color:var(--chalk-dim);line-height:1.45}
.top-row{display:flex;align-items:center;gap:10px}
.top-row h2{flex:1;text-align:left;font-size:30px}
.srow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:10px;padding:6px 10px;min-width:0}
.srow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow b{font-family:var(--hand);font-weight:400;font-size:24px}
.srow.me{outline:2px solid var(--yellow)}
.tabs{display:flex;gap:6px}
.lbrow{display:grid;grid-template-columns:28px 1fr 44px 44px 58px;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px}
.lbrow.head{color:var(--chalk-dim);font-size:12px;padding-bottom:0}
.lbrow:nth-child(even){background:rgba(0,0,0,.16)}
.lbrow.me{outline:2px solid var(--yellow)}
.lbrow span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lbrow .r{text-align:right;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(0,0,0,.22);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--hand);font-weight:400;font-size:30px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:12.5px;color:var(--chalk-dim)}
.how h3{margin-top:6px;color:var(--yellow)}
.how p{margin:2px 0 0;font-size:15px;line-height:1.5}
.code{font-family:var(--hand);font-size:54px;letter-spacing:.14em;text-align:center;color:var(--yellow);line-height:1}
.err{color:var(--red);font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,18,15,.9);border:2px solid var(--chalk-dim);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--ink);z-index:60;font-size:18px}
</style>

</head>
<body>
<canvas id="gl"></canvas>
<div id="pops"></div>
<div id="hud" hidden><div id="chips"></div><div id="turn"></div></div>
<div id="gameControls" hidden>
  <div class="ctrl-card">
    <div class="ctrl-title" data-control-label="camera">CAMERA</div>
    <div class="ctrl-actions"><button class="ctrl-btn" id="cameraReset" type="button">↺ <span data-control-label="reset">Reset</span></button></div>
  </div>
  <div class="ctrl-card">
    <div class="ctrl-title" data-control-label="penAngle">PEN ANGLE</div>
    <div class="ctrl-actions"><button class="ctrl-btn" id="rotateMode" type="button" aria-pressed="false">↻ <span data-control-label="rotate">Rotate pen</span></button><span id="angleValue">0°</span></div>
    <input id="angleControl" type="range" min="-180" max="180" step="1" value="0" aria-label="Pen angle">
  </div>
</div>
<button id="pauseBtn" hidden data-i="pause"></button>
<div id="toast" hidden></div>
<div id="nogl" hidden>This game needs WebGL. Please try another browser.</div>

<section class="screen show" id="s-home">
  <div class="panel">
    <h1 id="title" data-i="appName"></h1>
    <p class="sub" data-i="tagline"></p>
    <div class="card">
      <h3 data-i="yourName"></h3>
      <input type="text" id="nameIn" maxlength="14" autocomplete="off" data-ip="namePh">
    </div>
    <button class="btn" id="bOffline" data-i="offline"></button>
    <button class="btn" id="bOnline" data-i="online"></button>
    <button class="btn alt" id="bBoard" data-i="board"></button>
    <button class="btn alt" id="bStats" data-i="stats"></button>
    <button class="btn alt" id="bHow" data-i="howto"></button>
    <div class="row">
      <div class="seg grow"><button id="langEn">English</button><button id="langBn">বাংলা</button></div>
      <button class="btn alt small" id="sndBtn"></button>
    </div>
  </div>
</section>

<section class="screen" id="s-setup">
  <div class="panel">
    <div class="top-row"><button class="arr" id="bSetupBack" aria-label="Back">‹</button><h2 data-i="offline"></h2></div>
    <div class="card">
      <h3 data-i="players"></h3>
      <div class="stepper"><button id="minus" aria-label="Fewer">−</button><b id="nval">2</b><button id="plus" aria-label="More">+</button></div>
      <div id="plist" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="card"><h3 data-i="match"></h3><div id="rulesLocal"></div><div class="note" id="rulesTxtLocal"></div></div>
    <button class="btn" id="bStart" data-i="start"></button>
  </div>
</section>

<section class="screen" id="s-lobby">
  <div class="panel">
    <div class="top-row"><button class="arr" id="bLobbyBack" aria-label="Back">‹</button><h2 data-i="online"></h2></div>
    <div id="lbChoose" style="display:flex;flex-direction:column;gap:12px">
      <p class="sub" data-i="onlineIntro"></p>
      <button class="btn" id="bCreate" data-i="createRoom"></button>
      <div class="card">
        <h3 data-i="joinRoom"></h3>
        <div class="row"><input type="text" id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" data-ip="enterCode"><button class="btn small" id="bJoin" data-i="join"></button></div>
      </div>
      <div class="err" id="lbErr" hidden></div>
    </div>
    <div id="lbRoom" style="display:none;flex-direction:column;gap:12px">
      <h3 style="text-align:center" data-i="roomCode"></h3>
      <div class="code" id="codeShow"></div>
      <div class="row" style="justify-content:center"><button class="btn alt small" id="bCopy" data-i="copy"></button></div>
      <p class="note" style="text-align:center" data-i="roomShare"></p>
      <div class="card"><h3 data-i="players"></h3><div id="lbPeers" style="display:flex;flex-direction:column;gap:8px"></div></div>
      <div class="card"><h3 data-i="match"></h3><div id="lbRules"></div><div class="note" id="lbRulesTxt"></div></div>
      <button class="btn" id="bHostStart" data-i="start"></button>
      <p class="sub" id="lbWait"></p>
    </div>
  </div>
</section>

<section class="screen" id="s-board">
  <div class="panel">
    <div class="top-row"><button class="arr" id="bBoardBack" aria-label="Back">‹</button><h2 data-i="board"></h2></div>
    <div class="tabs seg" id="lbTabs"></div>
    <div id="lbList" style="display:flex;flex-direction:column;gap:2px"></div>
    <p class="note" id="lbNote"></p>
  </div>
</section>

<section class="screen" id="s-stats">
  <div class="panel">
    <div class="top-row"><button class="arr" id="bStatsBack" aria-label="Back">‹</button><h2 data-i="stats"></h2></div>
    <div class="statgrid" id="statGrid"></div>
    <p class="note" data-i="statsNote"></p>
    <button class="btn alt" id="bReset"></button>
  </div>
</section>

<section class="screen" id="s-how">
  <div class="panel how">
    <div class="top-row"><button class="arr" id="bHowBack" aria-label="Back">‹</button><h2 data-i="howto"></h2></div>
    <div id="howBody"></div>
  </div>
</section>

<section class="screen" id="s-result">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <p class="sub" id="resNote"></p>
    <div id="resBoard" style="display:flex;flex-direction:column;gap:6px"></div>
    <button class="btn" id="bNext"></button>
    <p class="sub" id="resWait" hidden data-i="waitHostNext"></p>
    <button class="btn alt" id="bResQuit" data-i="quit"></button>
  </div>
</section>

<section class="screen" id="s-pause">
  <div class="panel">
    <h2 data-i="paused"></h2>
    <button class="btn" id="bResume" data-i="resume"></button>
    <button class="btn alt" id="bQuit" data-i="quit"></button>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const R1 = v => Math.round(v * 10) / 10, R2 = v => Math.round(v * 100) / 100;
const wrapAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   Standalone backend. Inside Claude the page uses Claude's own room and db.
   On GitHub Pages (or any host) it uses a Firebase Realtime Database instead.
   Without firebase-config.js filled in, online play is off and the game stays offline.
   ===================================================================== */
const FB = (() => {
  let ready = null, db = null, uid = null;
  const pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function init() {
    if (ready) return ready;
    ready = (async () => {
      const c = window.PD_FIREBASE;
      if (!c || !c.apiKey || !c.databaseURL || !window.firebase) return false;
      try {
        firebase.initializeApp(c);
        const cred = await firebase.auth().signInAnonymously();
        uid = cred.user.uid; db = firebase.database(); return true;
      } catch (e) { return false; }
    })();
    return ready;
  }
  const userNs = { id: async () => uid };
  const dbNs = {
    doc(path) {
      return {
        async get() { const s = await db.ref(path).once('value'), v = s.val(); return { exists: v != null, data: () => v }; },
        async set(d) { await db.ref(path).set(d); }
      };
    },
    collection(path) {
      return { limit(n) { return { onSnapshot(cb, err) {
        const q = db.ref(path).limitToFirst(n);
        const h = q.on('value', s => { const docs = []; s.forEach(ch => { const v = ch.val(); docs.push({ id: ch.key, data: () => v }); }); cb({ docs }); }, e => { if (err) err(e); });
        return () => q.off('value', h);
      } }; } };
    }
  };
  const roomNs = {
    async join(name) {
      const base = db.ref('rooms/' + name + '/peers'), me = base.child(pid);
      let mine = {}, remote = {}, arr = [], timer = 0, last = 0, left = false, raf = 0;
      const subs = new Set();
      const rebuild = () => {
        const now = Date.now(), out = [];
        for (const id in remote) if (id !== pid) out.push({ peer: id, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: remote[id], updatedAt: now });
        out.push({ peer: pid, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine, updatedAt: now });
        arr = out;
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (!left) subs.forEach(f => { try { f({ peers: arr, joined: [], left: [], updated: [] }); } catch (e) {} }); });
      };
      const put = s => { remote[s.key] = s.val() || {}; rebuild(); };
      const gone = s => { delete remote[s.key]; rebuild(); };
      base.on('child_added', put); base.on('child_changed', put); base.on('child_removed', gone);
      me.onDisconnect().remove();
      const flush = () => { timer = 0; last = Date.now(); if (!left) me.set(mine).catch(() => {}); };
      rebuild();
      return {
        peers: () => arr,
        presence(patch) {
          for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
          rebuild();
          if (!timer) timer = setTimeout(flush, Math.max(0, 45 - (Date.now() - last)));
          return Promise.resolve();
        },
        onPeers(fn) { subs.add(fn); Promise.resolve().then(() => { if (subs.has(fn)) fn({ peers: arr, joined: arr, left: [], updated: [] }); }); return () => { subs.delete(fn); }; },
        async leave() {
          left = true; clearTimeout(timer); subs.clear();
          base.off('child_added', put); base.off('child_changed', put); base.off('child_removed', gone);
          try { await me.remove(); } catch (e) {}
        }
      };

$('bResume').onclick = () => { sfx.tap(); hideScreens(); };
$('bQuit').onclick = () => { sfx.tap(); quitGame(); };
$('bCreate').onclick = () => { sfx.unlock(); sfx.tap(); let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0]; enterRoom(c, true); };
$('bJoin').onclick = () => { sfx.unlock(); sfx.tap(); const c = $('codeIn').value.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); if (c.length < 3) return; enterRoom(c, false); };
$('codeIn').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
$('bHostStart').onclick = () => { sfx.unlock(); sfx.tap(); hostStart(); };
$('bCopy').onclick = () => { const c = roomCode.toUpperCase(); try { navigator.clipboard.writeText(c).then(() => toast(t('codeCopied')), () => toast(c)); } catch (e) { toast(c); } };
$('bReset').onclick = () => {
  if (!resetArmed) { resetArmed = true; clearTimeout(resetT); resetT = setTimeout(() => { resetArmed = false; renderStats(); }, 3000); renderStats(); return; }
  resetArmed = false; stats = defStats(); saveStats(); renderStats(); pushBoard();
};

addEventListener('resize', placeCamera);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

/* ---- boot ---- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); updateHud(); render();
  requestAnimationFrame(frame);
}
setDesk(1); buildDemo(); applyLang(); refreshDeskFonts(); initData();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
